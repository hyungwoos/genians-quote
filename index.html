<!DOCTYPE html>

    <style>

        :root { --genians-green: #1fb53a; --border-color: #000; --gray-bg: #f8f9fa; }
        * { box-sizing: border-box; -webkit-print-color-adjust: exact; }
        body { font-family: 'Noto Sans KR', sans-serif; background: #525659; margin: 0; padding: 20px; color: #333; }

        .toolbar { width: 210mm; margin: 0 auto 15px; background: #fff; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn { padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; border: none; color: white; }
        .btn-print { background: var(--genians-green); }
        .btn-add { background: #343a40; }

        .page { width: 210mm; min-height: 297mm; background: white; margin: 0 auto; padding: 15mm; position: relative; }
        input, select, textarea { width: 100%; border: none; outline: none; font-family: inherit; font-size: inherit; background: transparent; padding: 2px; }
        select { border: 1px solid #ccc; background: #fff; border-radius: 3px; padding: 4px; font-size: 11px; }
        
        .doc-title { font-size: 36px; font-weight: 900; text-align: center; letter-spacing: 15px; text-decoration: underline; text-underline-offset: 10px; margin-bottom: 30px; }
        
        /* 상단 정보 섹션 (고객사 / 공급자) */
        .info-section { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 12px; }
        .info-left { width: 45%; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding-bottom: 5px; }
        .info-left .input-line { border-bottom: 1px solid #aaa; border-radius: 0; padding-left: 5px; }
        
        .info-right { width: 50%; }
        .info-right table { width: 100%; border-collapse: collapse; border: 2px solid var(--border-color); font-size: 11px; }
        .info-right th, .info-right td { border: 1px solid var(--border-color); padding: 4px; text-align: center; }
        .info-right th { background: #f0f0f0; font-weight: bold; }
        .info-right .provider-title { writing-mode: vertical-rl; text-orientation: upright; width: 25px; letter-spacing: 5px; font-size: 13px; }
        
        .main-table { width: 100%; border-collapse: collapse; border: 1px solid var(--border-color); font-size: 11px; table-layout: fixed; }
        .main-table th { background: var(--genians-green); color: white; height: 35px; border: 1px solid var(--genians-green); }
        .main-table td { border: 1px solid #ccc; height: 40px; padding: 2px; text-align: center; }
        .text-right { text-align: right !important; }
        .input-num { text-align: right; }

        .amount-box { margin-top: 15px; border: 2px solid var(--border-color); padding: 15px; font-size: 16px; font-weight: bold; display: flex; justify-content: space-between; background: #fdfdfd; }
        
        /* 하단 비고 섹션 */
        .remarks-section { margin-top: 25px; font-size: 12px; }
        .remarks-section table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .remarks-section td { padding: 5px; vertical-align: middle; }
        .remarks-section input { font-size: 11px; width: 100%; text-align: left; } 
        .remarks-section textarea { width: 100%; height: 60px; resize: none; border: 1px solid #eee; padding: 5px; font-size: 11px; font-family: inherit; }

        .only-print { display: none; }
        .print-text { display: none; }

        @media print {
            body { background: none; padding: 0; }
            .toolbar, .btn-del, .no-print { display: none !important; }
            .only-print { display: block !important; }
            .page { box-shadow: none; margin: 0; }
            .print-text { display: block !important; }
            input::placeholder, textarea::placeholder { color: transparent; }
            .info-left .input-line, input, textarea { border: none !important; }
            input[type="date"]::-webkit-calendar-picker-indicator { display: none; }
            select { display: none !important; }
            .remarks-section textarea { border: none !important; resize: none; overflow: hidden; }

                <select class="product-sel" onchange="updateOptions(this);">
                    <option value="">-- 서비스 선택 --</option>
                    ${Object.keys(pricingDB).map(name => `<option value="${name}">${name}</option>`).join('')}
                </select>
                <div class="print-text"></div>
            </td>
            <td>
                <select class="term-sel" onchange="calcAll()">
                    <option value="">-- 계약 기간 --</option>
                </select>
                <div class="print-text"></div>
            </td>
            <td>
                <select class="billing-sel" onchange="calcAll()">
                    <option value="12">연납(1년)</option>
                    <option value="1">월납</option>
                </select>
                <div class="print-text"></div>
            </td>
            <td><input type="text" class="consumer-price input-num text-right" readonly placeholder="자동계산"></td>
            <td><input type="number" class="qty input-num" value="1" oninput="calcAll()" style="display: none; width: 100%;"></td>
            <td><input type="text" class="proposed-price input-num text-right" oninput="formatCurrency(this)" placeholder="직접입력"></td>
            <td><input type="text" class="row-total input-num text-right" readonly></td>
            <td><input type="text" class="row-vat input-num text-right" readonly></td>
            <td style="position:relative;">
                <input type="text">
                <button class="btn-del" onclick="this.closest('tr').remove(); calcAll();" style="position:absolute; right:-25px; top:10px; background:red; color:white; border:none; border-radius:50%; cursor:pointer; width:20px; height:20px; font-size:10px;">X</button>
            </td>
        `;
        tbody.appendChild(tr);
        updateQuoteMessage(); 
    }

    function updateOptions(selectElem) {
        const tr = selectElem.closest('tr');
        const termSel = tr.querySelector('.term-sel');
        const qtyInput = tr.querySelector('.qty');
        const prodName = selectElem.value;
        
        termSel.innerHTML = '<option value="">-- 계약 기간 --</option>';
        
        if(!prodName) {
            qtyInput.style.display = 'none';
            tr.querySelector('.consumer-price').value = "";
            tr.querySelector('.proposed-price').value = "";
            tr.querySelector('.row-total').value = "";
            tr.querySelector('.row-vat').value = "";
            calcAll();
            return;
        } else {
            qtyInput.style.display = 'inline-block';
        }

        const conditions = Object.keys(pricingDB[prodName].tiers[0].prices);
        conditions.forEach(cond => {
            termSel.innerHTML += `<option value="${cond}">${cond}</option>`;
        });

        if (conditions.length > 0) {
            termSel.value = conditions[0];
        }

        calcAll();
    }

    function formatCurrency(input) {
        let val = input.value.replace(/[^0-9]/g, '');
        if(val) { input.value = parseInt(val).toLocaleString(); } 
        else { input.value = ''; }
        calcAll();
    }

    function calcAll() {
        let grandVal = 0, grandVat = 0;
        const rows = document.querySelectorAll('#itemTable tbody tr');

        rows.forEach(tr => {
            const prodName = tr.querySelector('.product-sel').value;
            const term = tr.querySelector('.term-sel').value;
            const billingMulti = parseInt(tr.querySelector('.billing-sel').value) || 1;
            const qty = parseInt(tr.querySelector('.qty').value) || 0;
            
            const proposedInput = tr.querySelector('.proposed-price').value.replace(/,/g, '');
            const proposedPrice = parseInt(proposedInput) || 0;

            let consumerPrice = 0;

            if (prodName && term && qty > 0) {
                const db = pricingDB[prodName];
                
                let tier = db.tiers.find(t => qty <= t.max);
                if(!tier) tier = db.tiers[db.tiers.length - 1];

                let basePrice = tier.prices[term] || 0;

                if(db.type === "monthly" && billingMulti === 12) basePrice *= 12;
                if(db.type === "yearly" && billingMulti === 1) basePrice = Math.floor(basePrice / 12);

                consumerPrice = basePrice;
            }

            const subTotal = proposedPrice * qty;
            const vat = Math.floor(subTotal * 0.1);

            if(prodName) {
                tr.querySelector('.consumer-price').value = consumerPrice ? consumerPrice.toLocaleString() : "";
                tr.querySelector('.row-total').value = subTotal ? subTotal.toLocaleString() : "";
                tr.querySelector('.row-vat').value = vat ? vat.toLocaleString() : "";
            }

            tr.querySelectorAll('select').forEach(sel => {
                sel.nextElementSibling.innerText = sel.options[sel.selectedIndex].text;
            });

            grandVal += subTotal;
            grandVat += vat;
        });

        const totalAmt = grandVal + grandVat;
        document.getElementById('numGrandTotal').innerText = totalAmt.toLocaleString();
        document.getElementById('txtGrandTotal').innerText = amtToKor(totalAmt);
        
        updateQuoteMessage(); 
    }

    function amtToKor(num) {
        if(num === 0) return "영";
        const kor = ["", "일", "이", "삼", "사", "오", "육", "칠", "팔", "구"];
        const unit = ["", "십", "백", "천"];
        const bigUnit = ["", "만", "억", "조"];
        let res = "", i = 0, n = num;
        while (n > 0) {
            let m = n % 10000, s = "", j = 0;
            while (m > 0) {
                let d = m % 10;
                if (d > 0) s = kor[d] + unit[j] + s;
                m = Math.floor(m / 10); j++;
            }
            if (s !== "") res = s + bigUnit[i] + res;
            n = Math.floor(n / 10000); i++;
        }
        return res;
    }
</script>
